name: Deploy Luqevora static public

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate committed public site
        shell: bash
        run: |
          set -euo pipefail

          test -f public/index.html
          test -f public/404.html
          test -f public/.nojekyll
          test -f public/CNAME
          test -f public/ja/mobile-connectivity/fiber-internet-comparison-remote-work-small-business/index.html

          file_count="$(find public -type f | wc -l | tr -d ' ')"
          if [ "$file_count" -ne 1723 ]; then
            echo "Expected 1723 public files, found $file_count." >&2
            exit 1
          fi

          if find public -type l -print -quit | grep -q .; then
            echo "Symbolic links are not allowed in the Pages artifact." >&2
            exit 1
          fi

          if grep -RInE '運営：LuQvia|Operated by LuQvia' public --include='*.html'; then
            echo "Legacy operator wording remains in public HTML." >&2
            exit 1
          fi

          article='public/ja/mobile-connectivity/fiber-internet-comparison-remote-work-small-business/index.html'
          a8_count="$(grep -o 'https://px\.a8\.net/' "$article" | wc -l | tr -d ' ')"
          if [ "$a8_count" -lt 5 ]; then
            echo "Expected at least 5 A8 affiliate links, found $a8_count." >&2
            exit 1
          fi

          echo "Static site validation passed: $file_count files, $a8_count A8 links."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-upload
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
